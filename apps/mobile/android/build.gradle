buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Task 19 (push): legge `google-services.json` (NON nel repo, vedi
        // README) e genera le risorse/config che
        // `@react-native-firebase/app` si aspetta di trovare a runtime.
        // Versione allineata a quella che RNFirebase stesso raccomanda
        // (verificato: `sdkVersions.android.gmsGoogleServicesGradle` nel
        // `package.json` installato di `@react-native-firebase/app`).
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
