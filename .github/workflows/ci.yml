name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annulla run obsolete sullo stesso ref (es. push rapidi su una PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # I test usano testcontainers: su CI Ryuk (il container di cleanup) è spesso
  # superfluo e a volte instabile, gli runner sono effimeri e vengono distrutti.
  TESTCONTAINERS_RYUK_DISABLED: "true"
  # Nessun job lancia Electron (apps/desktop: test node/happy-dom e build): il
  # binario non serve, quindi l'install non lo scarica.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # Lavoro in parallelo, ognuno sulla sua macchina (20 ott 2026). Prima era un
  # solo job serializzato da ~15 minuti: build, lint, typecheck e TUTTI i test
  # uno dopo l'altro sulle stesse 2 vCPU. Ora «check» fa build, plugin, lint e
  # typecheck, «plan» decide quali gruppi di test servono, e ogni gruppo gira
  # su un runner a sé.
  check:
    name: Lint e typecheck
    runs-on: ubuntu-latest
    steps:
      # Tutta la storia, non solo l'ultimo commit: sulle PR il controllo del
      # plugin confronta il branch con la sua base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Abilita corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # Build prima di tutto: il typecheck dei consumer dipende dagli artefatti
      # dist dei package di workspace. Qui si builda TUTTO apposta: è anche la
      # prova che `pnpm -r build` passa, che i job di test (build parziali)
      # non danno.
      - name: Build
        run: pnpm -r build

      # Il dist sotto l'ESM VERO di node (15 nov 2026): vitest tollera import
      # con nome da pacchetti CommonJS che node rifiuta al link, e il server
      # non partiva (`import { utils } from "ssh2"`). Il controllo degli import
      # con nome su ogni dist node, il suo test, e lo smoke di avvio del server.
      - name: Dist sotto node vero
        run: node --test scripts/check-esm-named-imports.test.mjs && pnpm check:dist
      # La CSP dell'origine (indurimento di sicurezza): il Caddyfile e il
      # controllo degli script inline del build di caddy.
      - name: CSP di Caddy
        run: node --test scripts/caddy-csp.test.mjs

      # Il plugin Claude Code «stubwise» (plugins/stubwise, marketplace in
      # .claude-plugin/): (1) sulle PR, una modifica al plugin chiede un
      # changeset che nomini plugin E @stubwise/mcp — senza versione nuova
      # nessuno riceve l'aggiornamento, e senza mcp ripubblicato l'avviso
      # «plugin vecchio» non lo annuncia; (2) le quattro copie della versione
      # sono allineate (test di parità); (3) plugin e marketplace passano la
      # validazione STRETTA del CLI, alla versione con cui sono stati provati.
      - name: Plugin Claude Code
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node packages/mcp/scripts/check-plugin-changeset.mjs "$BASE_SHA"
          fi
          pnpm --filter @stubwise/mcp exec vitest run src/plugin-version.test.ts
          npx -y @anthropic-ai/claude-code@2.1.294 plugin validate --strict plugins/stubwise
          npx -y @anthropic-ai/claude-code@2.1.294 plugin validate --strict .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # La nuova app (integrazione area 2, fetta 1): il renderer dell'app
      # desktop in modo «app» si builda, e nel bundle non c'è nessun dato del
      # seed del prototipo (anti-obiettivo «dati finti davanti a un utente
      # vero»). DUE bundle, con i comandi di `apps/desktop/package.json` (UNA
      # regola sola: `check:seed:web` lo usa anche Dockerfile.caddy, e i
      # pacchetti del Mac vanno sullo stesso `check:seed:app`):
      # - `check:seed:web`: il bundle servito da caddy su /app (`dist-web`);
      # - `check:seed:app`: quello dell'app Electron (`out/`, main, preload e
      #   renderer), che prima si controllava SOLO a mano in `package:mac`
      #   (25 nov 2026: il seme ci è entrato senza che nessun automatismo lo
      #   vedesse). Due varianti, come i due pacchetti del Mac: quella di
      #   default e quella firmata con la cassaforte (`STUBWISE_VAULT_DESKTOP=on`,
      #   che `build:app` eredita dall'ambiente).
      - name: Build web della nuova app, senza seed
        run: pnpm --filter @stubwise/desktop check:seed:web

      - name: Build dell'app desktop (Electron), senza seed
        run: |
          pnpm --filter @stubwise/desktop check:seed:app
          STUBWISE_VAULT_DESKTOP=on pnpm --filter @stubwise/desktop check:seed:app

      # ⚠️ SULLE PR SI TESTANO SOLO I PACCHETTI TOCCATI E CHI NE DIPENDE (24 set
      # 2026), con due reti di sicurezza che non vanno tolte: un file fuori da
      # `apps|packages|plugins` (esclusi docs, `*.md` e `graphify-out/`) fa
      # testare tutto, e il push su main testa SEMPRE tutto. La regola, e il
      # perché di entrambe le reti, sta nel docblock di
      # `.github/scripts/ci-plan.mjs`, che la calcola UNA volta per tutti i
      # gruppi. Il push su main resta il giro completo anche per un'altra
      # ragione: il workflow Release parte solo quando QUESTO giro è verde.
  plan:
    name: Quali test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Solo node e git: nessuna install, il piano legge i package.json.
      - name: Calcola i gruppi di test
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-plan.mjs

  # Un gruppo per macchina: server, worker, desktop, web, mobile e «resto»
  # (tutti gli altri pacchetti con test). Desktop, server e worker si
  # dividono in parti (28 nov 2026: erano 19, 20 e 8 minuti di vitest su una
  # macchina sola, e la CI durava circa 30 minuti): «Test desktop 1/4» … 4/4,
  # «Test server 1/3» … 3/3, «Test worker 1/2» e 2/2. Le parti e il perché
  # dei numeri stanno in `SHARDS` di `.github/scripts/ci-plan.mjs`; la parte
  # arriva allo script `test` del pacchetto con l'env `VITEST_SHARD`, che lo
  # script passa a `vitest run --shard` (e non al build che server e worker
  # fanno prima). Un gruppo non toccato non compare nella matrice; se non ne
  # serve nessuno il job è saltato (verde).
  #
  # I runner ubuntu-latest hanno Docker: i test di server/worker/db avviano
  # Postgres via testcontainers (i fork interni restano limitati dalle
  # vitest.config dei singoli package). Ogni gruppo ha le sue ~2 vCPU, così i
  # test web (CPU-bound, userEvent) non competono più con i container del
  # server — era quella competizione a interlacciare la digitazione e a
  # mandare in timeout. Dentro «resto», più pacchetti sulla stessa macchina,
  # `--workspace-concurrency=1` li serializza per lo stesso motivo.
  test:
    name: Test ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Un gruppo rosso non ferma gli altri: si vede tutto quello che fallisce.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Abilita corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # Solo ciò che serve al gruppo, non `pnpm -r build`: i test leggono le
      # dist delle dipendenze di workspace. `deps` (le app, testate sui
      # sorgenti) = le sole dipendenze, `pkg^...`; `self` («resto») = anche il
      # pacchetto stesso, `pkg...`, perché alcuni test leggono la PROPRIA dist
      # (`load-isolated.test.ts` di @stubwise/shared). Server e worker si
      # ribuildano poi una parte delle dipendenze nel loro script `test`:
      # doppio lavoro accettato, lo script resta il contratto anche in locale.
      - name: Build delle dipendenze
        env:
          PACKAGES: ${{ matrix.packages }}
          BUILD: ${{ matrix.build }}
        run: |
          FILTERS=()
          for p in $PACKAGES; do
            if [ "$BUILD" = "deps" ]; then FILTERS+=(--filter "$p^..."); else FILTERS+=(--filter "$p..."); fi
          done
          pnpm -r "${FILTERS[@]}" build

      - name: Test
        env:
          PACKAGES: ${{ matrix.packages }}
          # La parte (`i/n`) per vitest, vuota nei gruppi su una macchina sola.
          VITEST_SHARD: ${{ matrix.shard }}
        run: |
          FILTERS=()
          for p in $PACKAGES; do FILTERS+=(--filter "$p"); done
          pnpm -r --workspace-concurrency=1 "${FILTERS[@]}" test

  e2e:
    name: E2E (Playwright)
    # Fissato (9 nov 2026): `ubuntu-latest` è passato a 26.04, dove la nostra
    # versione di Playwright non installa Chromium («does not support chromium
    # on ubuntu26.04-x64»). Si torna a `latest` aggiornando Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Abilita corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # La suite e2e avvia uno stack reale (server Fastify + vite dev) contro
      # un Postgres testcontainer; serve la build dei package di workspace.
      - name: Build
        run: pnpm -r build

      - name: Installa il browser Playwright
        run: pnpm --filter @stubwise/web exec playwright install --with-deps chromium

      - name: Esegui i test e2e
        run: pnpm --filter @stubwise/web e2e

      # La nuova app (D3 del piano del taglio): la build web VERA servita su
      # /app con le intestazioni del Caddyfile, contro lo stesso tipo di stack
      # (Postgres testcontainers + server vero, porte sue: 3220 e 5220). Quando
      # il web vecchio sparisce, il passo qui sopra va via e resta questo.
      - name: Esegui i test e2e della nuova app
        run: pnpm --filter @stubwise/desktop e2e

      - name: Carica il report Playwright in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
