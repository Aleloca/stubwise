name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annulla run obsolete sullo stesso ref (es. push rapidi su una PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # I test usano testcontainers: su CI Ryuk (il container di cleanup) è spesso
  # superfluo e a volte instabile, gli runner sono effimeri e vengono distrutti.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  check:
    name: Lint, typecheck e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Abilita corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # Build prima di tutto: test, typecheck dei consumer e docs dipendono
      # dagli artefatti dist dei package di workspace.
      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # I runner ubuntu-latest hanno Docker disponibile: i test di server/worker/db
      # avviano Postgres via testcontainers. I runner hanno ~2 vCPU: eseguire i
      # package in parallelo (default) faceva competere i test web (jsdom/userEvent,
      # CPU-bound) con i container Postgres del server → digitazione userEvent
      # interlacciata/garbled e timeout. `--workspace-concurrency=1` serializza i
      # package così ciascuno ha le CPU per sé (i fork interni restano limitati
      # dalle vitest.config dei singoli package).
      - name: Test
        run: pnpm -r --workspace-concurrency=1 test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Abilita corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # La suite e2e avvia uno stack reale (server Fastify + vite dev) contro
      # un Postgres testcontainer; serve la build dei package di workspace.
      - name: Build
        run: pnpm -r build

      - name: Installa il browser Playwright
        run: pnpm --filter @stubwise/web exec playwright install --with-deps chromium

      - name: Esegui i test e2e
        run: pnpm --filter @stubwise/web e2e

      - name: Carica il report Playwright in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
