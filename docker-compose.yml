# Deploy self-hosted di Stubwise.
#
# Avvio: copia .env.example in .env, compila i segreti, poi:
#   docker compose up -d --build
#
# Tutti i build usano la radice del repo come context (monorepo pnpm).

# Rotazione dei log json-file: senza, i log dei container crescono senza limite
# e possono saturare il disco dell'host. 3 file da 10m = max ~30m per servizio.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # pgvector/pgvector:pg17 = Postgres 17 con l'estensione `vector` disponibile
    # a runtime. Serve alla documentazione autogenerata (migrazione 0026 fa
    # `CREATE EXTENSION IF NOT EXISTS vector` e crea un indice HNSW sugli
    # embedding). Stessa immagine usata dal testcontainer (packages/db/src/
    # testing.ts) per coerenza dev/prod.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stubwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stubwise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stubwise} -d ${POSTGRES_DB:-stubwise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servizio di embedding self-hosted (API OpenAI-compatibile su /v1) usato dalla
  # documentazione autogenerata: server e worker chiamano EMBEDDING_BASE_URL
  # (http://ollama:11434/v1) col modello bge-m3 (1024 dim). Nessuna API key.
  #
  # IMPORTANTE: il modello va scaricato UNA volta dopo il primo `up` (il volume
  # ollama lo persiste tra i riavvii):
  #   docker compose exec ollama ollama pull bge-m3
  # Finché il modello non è presente, le chiamate di embedding falliscono e la
  # generazione doc va in errore (gli altri servizi restano operativi).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    logging: *default-logging

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Embedding self-hosted: avviato col server (la ricerca/chat lo usa). Non
      # ha healthcheck: `service_started` basta (il modello si scarica a parte).
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: ${PORT:-3000}
      # Caddy fa da reverse proxy davanti: il server deve fidarsi degli
      # X-Forwarded-* per impostare il flag Secure sul cookie di sessione.
      TRUST_PROXY: "true"
      # Embedding per la documentazione autogenerata (ricerca semantica + chat
      # RAG): il server interroga il servizio `ollama` (API OpenAI-compatibile).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Tetti giornalieri per progetto del widget customer service (anti-abuso/
      # costo): messaggi di chat e segnalazioni. Tunabili solo qui, non dal
      # pannello impostazioni del progetto.
      WIDGET_DAILY_MESSAGE_CAP: ${WIDGET_DAILY_MESSAGE_CAP:-200}
      WIDGET_DAILY_TICKET_CAP: ${WIDGET_DAILY_TICKET_CAP:-50}
      # Volume dei grafi graphify: il server lo legge (report/html/json serviti
      # alla SPA). Stesso path del worker, che invece ci scrive.
      GRAPHS_DIR: /graphs
      # --- Retrieval dal grafo nelle chat interne (Docs repo/progetto, backlog,
      # /docs di Slack) ---
      # Server MCP del container `graphify`, solo rete interna: le chat gli
      # chiedono il sottografo della domanda. ATTENZIONE: qui la stringa VUOTA
      # NON significa "usa il default" ma "feature spenta" → è il ROLLBACK
      # (GRAPHIFY_MCP_URL= nel .env + restart, le chat tornano al solo pgvector).
      # Per questo la sostituzione usa `-` e non `:-`: con `:-` una variabile
      # definita ma vuota ricadrebbe sul default e lo spegnimento non funzionerebbe.
      GRAPHIFY_MCP_URL: ${GRAPHIFY_MCP_URL-http://graphify:8080/mcp}
      # Mirror git del worker: il server ci legge i blob citati dal sottografo
      # per allegare gli snippet di codice. Deve coincidere col path del worker
      # e col mount qui sotto.
      MIRRORS_DIR: /var/stubwise/mirrors
      # Budget di token del sottografo per domanda (diviso per il numero di repo
      # nelle chat di progetto); quanti nodi diventano snippet e tetto
      # complessivo dei caratteri di codice allegati a una risposta.
      GRAPH_CHAT_TOKEN_BUDGET: ${GRAPH_CHAT_TOKEN_BUDGET:-1200}
      GRAPH_CHAT_SNIPPET_MAX_CHARS: ${GRAPH_CHAT_SNIPPET_MAX_CHARS:-6000}
      GRAPH_CHAT_SNIPPET_NODES: ${GRAPH_CHAT_SNIPPET_NODES:-6}
    volumes:
      # Output di graphify: il server lo monta READ-ONLY (:ro). L'unico
      # produttore è il worker; qui si serve solo il contenuto.
      - graphs:/graphs:ro
      # Mirror git: READ-ONLY anche questi. Il server LEGGE i blob per gli
      # snippet della chat; l'unico scrittore (clone/fetch) resta il worker.
      # NB: funziona perché l'utente non-root delle DUE immagini ha lo stesso
      # uid 10001 — con uid diversi git rifiuterebbe i mirror per "dubious
      # ownership" e gli snippet sparirebbero (in silenzio, fail-open).
      - mirrors:/var/stubwise/mirrors:ro
    logging: *default-logging
    # Il server applica le migrazioni all'avvio (runMigrations): worker e Caddy
    # lo aspettano sano. Healthcheck definito nell'immagine (hit /health).

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Lo schema lo crea il server (migrazioni): il worker parte solo dopo
      # che il server e' sano.
      server:
        condition: service_healthy
      # Embedding self-hosted: il worker embedda i chunk delle pagine generate.
      ollama:
        condition: service_started
    # Forma LISTA (non mapping): permette il pass-through `- NOME` per le
    # credenziali Claude opzionali, che compose OMETTE dall'env del container se
    # non sono definite — invece di passarle come stringa vuota (cosa che la
    # forma mapping `NOME: ${NOME}` fa sempre, e che puo' sabotare un OAuth).
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # STESSA chiave del server: decifra le credenziali git e le credenziali AI.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # URL pubblico dell'istanza: il worker lo usa SOLO per i link al ticket
      # nelle notifiche webhook in uscita. Vuoto = il link e' il solo path.
      - PUBLIC_URL=${PUBLIC_URL}
      - MIRRORS_DIR=/var/stubwise/mirrors
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      # Pool di connessioni Postgres del worker: alzalo in proporzione a
      # WORKER_CONCURRENCY (i job concorrenti si contendono le connessioni).
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      # Deve superare l'invariante verificato all'avvio del worker. Con fix a
      # due fasi + self-repair: install(10', una volta) + 2x plan(10', la
      # ripresa da una risposta puo' lanciare un --resume fallito piu' il
      # fallback pieno) + fix(30') + self-repair 2x(fix 30' + test 5') +
      # 2x triage(2') + margine(5') ~= 139'.
      # Default 150. Se abbassi SELF_REPAIR_MAX_ATTEMPTS l'invariante cala e puoi
      # ridurlo.
      - WORKER_STALE_MINUTES=${WORKER_STALE_MINUTES:-150}
      # --- Fix a due fasi: opus pianifica (sola lettura), sonnet esegue ---
      - FIX_TWO_PHASE=${FIX_TWO_PHASE:-true}
      - FIX_PLAN_MODEL=${FIX_PLAN_MODEL:-opus}
      - FIX_EXECUTE_MODEL=${FIX_EXECUTE_MODEL:-sonnet}
      - FIX_PLAN_TIMEOUT_MS=${FIX_PLAN_TIMEOUT_MS:-600000}
      # Quante DOMANDE puo' fare l'agente durante la pianificazione di UN job
      # (tool ask_user): il job si ferma, la domanda arriva in inbox/Slack/ticket
      # e riparte con la risposta. Contate anche quelle gia' risposte; oltre il
      # tetto l'agente sceglie da se' e documenta la scelta nel piano. Vale solo
      # per i run che pianificano (non l'esecuzione diretta di un piano salvato).
      # Minimo 1. Default 5.
      - AGENT_QUESTION_MAX_ROUNDS=${AGENT_QUESTION_MAX_ROUNDS:-5}
      # Timeout dell'install delle dipendenze nel worktree: gira una volta prima
      # del fix/test (e' l'addendo singolo dell'invariante di staleness sopra).
      - INSTALL_TIMEOUT_MS=${INSTALL_TIMEOUT_MS:-600000}
      # --- Embedding documentazione autogenerata ---
      # Il worker embedda i chunk delle pagine generate via il servizio `ollama`
      # (API OpenAI-compatibile /v1). Ricordati `docker compose exec ollama
      # ollama pull bge-m3` al primo avvio. EMBEDDING_API_KEY in forma
      # pass-through (`- NOME`): se non è in .env compose la OMETTE (Ollama non
      # ne vuole; niente Authorization vuoto).
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - EMBEDDING_API_KEY
      # --- Auto-update Docs: rigenerazione mirata (Fase 2) ---
      # Ad ogni push, tetto al numero di pagine ESISTENTI che vengono riscritte perché
      # impattate dal diff. 0 = disabilita la rigenerazione mirata (solo entry release).
      # Default codice 10; qui alzato per NON limitare l'auto-generazione (ogni pagina
      # = un run agente serializzato: valore alto = più lavoro possibile per push).
      - DOCS_AUTOUPDATE_MAX_PAGES=${DOCS_AUTOUPDATE_MAX_PAGES:-100000}
      # --- Auto-update Docs: creazione incrementale (Fase 3) ---
      # Ad ogni push, per le AREE del repo non ancora coperte da alcuna pagina, un
      # mini-orient propone fino a questo numero di pagine NUOVE e le crea nella
      # generazione corrente. 0 = disabilita (le aree nuove restano solo segnalate
      # nella entry release, con invito alla rigenerazione completa). Default codice 5;
      # qui alzato per NON limitare l'auto-generazione.
      - DOCS_AUTOUPDATE_MAX_NEW_PAGES=${DOCS_AUTOUPDATE_MAX_NEW_PAGES:-100000}
      # --- Docs: classe product (Fase B) ---
      # Dopo la chiusura dei due alberi interni, per ogni superficie PUBBLICA UI del brief
      # si genera una verticale pubblica (radice + guide per journey + FAQ), fino a questo
      # tetto PER VERTICALE (ogni superficie riparte col suo budget). Budget SEPARATO da
      # DOC_MAX_NODES. 0 = fase product disattivata (nessuna verticale pubblica). Default 12.
      - DOC_PRODUCT_MAX_PAGES=${DOC_PRODUCT_MAX_PAGES:-12}
      # --- Monitoraggio server (poller separati dal loop dei job) ---
      # Rollup + retention delle metriche: aggrega i campioni fini oltre le 48h in
      # bucket da 5' e applica la retention (90gg sui rollup). 0 = disabilitato.
      # Default 5'. Max 1440 (un giorno).
      - MONITOR_ROLLUP_INTERVAL_MINUTES=${MONITOR_ROLLUP_INTERVAL_MINUTES:-5}
      # Valutazione alert (offline/soglie sostenute/check down con isteresi ed
      # emissione monitor.alert/recovered). Più frequente del rollup: allarmi
      # reattivi. 0 = disabilitato. Default 1'. Max 60.
      - MONITOR_ALERT_INTERVAL_MINUTES=${MONITOR_ALERT_INTERVAL_MINUTES:-1}
      # --- Outbox delle notifiche (notification_deliveries) ---
      # Poller che spedisce le consegne dovute sul loro canale: webhook
      # d'istanza, DM Slack per destinatario (`slack_dm`) e riscrittura del DM
      # dopo un'azione (`slack_update`). Il gating dei toggle è già applicato
      # alla pubblicazione: qui si invia soltanto, con backoff 30s x 2^n e 5
      # tentativi. Breve perché una notifica deve arrivare subito.
      # 0 = disabilitato (le consegne si accumulano senza partire).
      # Default: 5 secondi.
      - NOTIFY_POLL_SECONDS=${NOTIFY_POLL_SECONDS:-5}
      # --- Notifiche push sull'app mobile (fase 4) ---
      # Il worker NON parla con APNs/FCM: spedisce al RELAY, che tiene le chiavi
      # dell'app (una sola, la nostra). Tre valori con tre significati diversi:
      # variabile ASSENTE -> relay pubblico (il default qui sotto, che deve
      # coincidere con DEFAULT_PUSH_RELAY_URL nel codice); stringa VUOTA -> push
      # SPENTE (e' l'interruttore del rollback); un URL https -> quel relay.
      # ATTENZIONE alla sintassi: `${VAR-default}` col TRATTINO NUDO, non `:-`.
      # Con i due punti una stringa vuota in .env verrebbe rimpiazzata dal
      # default e le push NON si spegnerebbero.
      - PUSH_RELAY_URL=${PUSH_RELAY_URL-https://push.stubwise.aleloca.dev}
      # --- Pulse proattivo (progetti fermi con voci nel backlog) ---
      # Poller che, DENTRO la finestra oraria d'istanza, cerca i progetti fermi
      # con voci proponibili e pubblica una notifica `project.pulse` con 2–3
      # proposte. 0 = disabilitato (il pulse tace: è anche il rollback della
      # feature). Default 15', più corto della finestra (un'ora) perché la
      # finestra venga incontrata anche se un tick salta.
      - PULSE_POLL_MINUTES=${PULSE_POLL_MINUTES:-15}
      # Fuso IANA della finestra (unico fuso del sistema: tutto il resto è UTC),
      # ora locale di apertura della finestra [ora, ora+1) e weekend escluso.
      # In produzione: PULSE_TIMEZONE=Europe/Rome.
      - PULSE_TIMEZONE=${PULSE_TIMEZONE:-UTC}
      - PULSE_SEND_HOUR=${PULSE_SEND_HOUR:-9}
      - PULSE_WEEKDAYS_ONLY=${PULSE_WEEKDAYS_ONLY:-true}
      # --- Riassunti "in breve" di piani e PR (fase 5) ---
      # Due o tre frasi in linguaggio non tecnico su cosa un piano cambia o su
      # cosa fa una PR, generate col piano/la review e scritte nella STESSA
      # transazione (mai da un poller a parte). false = nessun run di riassunto:
      # plan_summary/pr_summary restano NULL e le card mostrano quello che
      # mostravano prima. È il ROLLBACK innocuo della sola generazione, senza
      # toccare schema né immagini.
      - SUMMARIES_ENABLED=${SUMMARIES_ENABLED:-true}
      # Modello dei run di riassunto. VUOTO/assente = lo stesso di
      # PR_REVIEW_MODEL: è lo stesso profilo di run (solo testo, read-only,
      # breve) e non ha senso tenerne allineati due.
      - SUMMARY_MODEL=${SUMMARY_MODEL:-}
      # --- Brief settimanale per progetto (fase 5) ---
      # Poller separato dal loop dei job: dentro la finestra settimanale genera
      # il brief della settimana appena chiusa per ogni progetto con
      # `weeklyBriefEnabled` (toggle per progetto, default OFF), e in ogni tick
      # lavora i brief accodati a mano dalla UI. 0 = disabilitato (nessun brief
      # nasce più, nemmeno quelli richiesti a mano): è il ROLLBACK innocuo della
      # feature. Default 15', più corto della finestra (un'ora) perché la
      # finestra venga incontrata anche se un tick salta.
      - BRIEF_POLL_MINUTES=${BRIEF_POLL_MINUTES:-15}
      # Giorno ISO della finestra d'invio (1 = lunedì … 7 = domenica) e ora
      # LOCALE di apertura della finestra [ora, ora+1). Il fuso è PULSE_TIMEZONE
      # qui sopra: è l'UNICO fuso dell'istanza, non se ne aggiunge un secondo.
      # Il PERIODO segue il giorno: spostando BRIEF_WEEKDAY al venerdì il brief
      # copre venerdì→giovedì, senza altra configurazione.
      - BRIEF_WEEKDAY=${BRIEF_WEEKDAY:-1}
      - BRIEF_SEND_HOUR=${BRIEF_SEND_HOUR:-9}
      # --- Backlog di discovery (poller separato dal loop dei job) ---
      # Reclama i job backlog_jobs (intake + deep dive) ed esegue gli agenti nella
      # catena PER-PROGETTO. Soglie del dedup semantico: merge (fusione automatica)
      # e similar (badge "simile a X", zona grigia sotto la merge; deve restare ≤
      # merge). Poll in secondi (0 = disabilitato). Modello economico di default;
      # timeout del run in ms (come la review).
      - BACKLOG_MERGE_THRESHOLD=${BACKLOG_MERGE_THRESHOLD:-0.9}
      - BACKLOG_SIMILAR_THRESHOLD=${BACKLOG_SIMILAR_THRESHOLD:-0.78}
      - BACKLOG_POLL_SECONDS=${BACKLOG_POLL_SECONDS:-20}
      - BACKLOG_MODEL=${BACKLOG_MODEL:-sonnet}
      - BACKLOG_AGENT_TIMEOUT_MS=${BACKLOG_AGENT_TIMEOUT_MS:-900000}
      # --- Sessione di analisi sul codice nella chat del backlog ---
      # Turni dell'agente claude CLI su un worktree read-only, con sessione CLI
      # persistente (--resume). Poller VELOCE dedicato (0 = disabilitato); sweep
      # TTL delle sessioni inattive; timeout e turni max del run per turno.
      - BACKLOG_CHAT_TURN_POLL_SECONDS=${BACKLOG_CHAT_TURN_POLL_SECONDS:-2}
      - BACKLOG_CHAT_SESSION_TTL_MINUTES=${BACKLOG_CHAT_SESSION_TTL_MINUTES:-30}
      - BACKLOG_CHAT_TURN_TIMEOUT_MS=${BACKLOG_CHAT_TURN_TIMEOUT_MS:-300000}
      - BACKLOG_CHAT_TURN_MAX_TURNS=${BACKLOG_CHAT_TURN_MAX_TURNS:-15}
      # --- Grafo delle dipendenze (graphify) ---
      # Il worker esegue il CLI graphify (nell'immagine, vedi apps/worker/
      # Dockerfile) su una worktree del mirror e scrive l'output in
      # <GRAPHS_DIR>/<repositoryId>/graphify-out/ sul volume condiviso `graphs`.
      # Il path DEVE coincidere col mount qui sotto.
      - GRAPHS_DIR=/graphs
      # Poller della coda graph_jobs, in secondi (0 = disabilitato: nessuna build
      # automatica del grafo sul push). Timeout in minuti di OGNI invocazione del
      # CLI: il passo lungo è il labeling delle comunità, non l'extract.
      - GRAPH_POLL_SECONDS=${GRAPH_POLL_SECONDS:-20}
      - GRAPH_BUILD_TIMEOUT_MINUTES=${GRAPH_BUILD_TIMEOUT_MINUTES:-20}
      # Nomi veri delle comunità via il backend claude-cli di graphify (usa lo
      # stesso claude CLI del worker). false = grafo valido coi placeholder
      # "Community N", senza spendere chiamate LLM.
      - GRAPH_LABEL_ENABLED=${GRAPH_LABEL_ENABLED:-true}
      # --- Registro plugin/skill Claude Code (d'istanza) ---
      # Il worker materializza i plugin registrati dall'admin in
      # <PLUGINS_DIR>/<slug>/<sha>/ sul volume `claude-plugins` (unico a
      # montarlo: il server legge l'inventario dal DB). Il path DEVE coincidere
      # col mount qui sotto.
      - PLUGINS_DIR=/plugins
      # Poller della coda plugin_jobs, in secondi: materializzazione + smoke run.
      # 0 = disabilitato (nessuna materializzazione parte): è il rollback della
      # feature, il registro resta com'è.
      - PLUGIN_POLL_SECONDS=${PLUGIN_POLL_SECONDS:-20}
      # --- Auth del CLI claude ---
      # Metodo raccomandato: gestisci le credenziali in Settings -> AI providers
      # (catena cifrata nel DB, con failover). Le due righe pass-through qui sotto
      # sono solo un FALLBACK retro-compatibile usato quando la catena e' vuota:
      # `- NOME` (senza `=`) passa la var SOLO se definita nel .env, altrimenti la
      # OMETTE (niente stringa vuota residua). OAuth/MAX via volume resta valido
      # (`docker compose exec worker claude login`, token in CLAUDE_CONFIG_DIR).
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN
      - CLAUDE_CONFIG_DIR=/home/worker/.claude
    volumes:
      - mirrors:/var/stubwise/mirrors
      - claude-config:/home/worker/.claude
      # Output di graphify: il worker ci SCRIVE (unico produttore).
      - graphs:/graphs
      # Plugin Claude Code del registro: il worker li materializza e li legge,
      # nessun altro servizio lo monta.
      - claude-plugins:/plugins
    # Limiti di risorse: un agent build puo' durare ~30 min e clonare/buildare
    # repo grandi. Senza tetti, un run impazzito affamerebbe postgres/caddy
    # sullo stesso host. Valori conservativi e TUNABLE in base alla macchina e
    # a WORKER_CONCURRENCY (questi reggono ~2 job in parallelo su repo medi):
    #   mem_limit: RAM massima del container (OOM-kill oltre).
    #   cpus: frazione di CPU (2 = due core pieni).
    mem_limit: 4g
    cpus: 2
    logging: *default-logging

  # Server MCP di graphify in Streamable HTTP sui grafi del volume `graphs`
  # (montato read-only: l'unico produttore resta il worker). È multi-progetto:
  # non ha un grafo di default, i client passano `project_path=/graphs/
  # <repositoryId>` a ogni tool e graphify ci cerca sotto graphify-out/graph.json.
  #
  # Il consumatore interno è il SERVER: le chat (Docs repo/progetto, backlog,
  # /docs di Slack) gli chiedono il sottografo della domanda su
  # http://graphify:8080/mcp (env GRAPHIFY_MCP_URL del servizio `server`). Per
  # questo non pubblica porte sull'host e non ha rotte su Caddy: vive solo sulla
  # rete interna del compose (e quindi gira anche senza --api-key).
  #
  # Nessun healthcheck: il transport MCP risponde solo a POST JSON-RPC su /mcp
  # (con Accept: application/json, text/event-stream) e l'immagine non ha curl —
  # una probe sarebbe più fragile del servizio che sorveglia. Verifica a mano:
  #   docker compose exec graphify python -c "import urllib.request,json; \
  #     r=urllib.request.Request('http://127.0.0.1:8080/mcp', \
  #     data=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params': \
  #     {'protocolVersion':'2025-03-26','capabilities':{},'clientInfo': \
  #     {'name':'probe','version':'1'}}}).encode(), headers={'Content-Type': \
  #     'application/json','Accept':'application/json, text/event-stream'}); \
  #     print(urllib.request.urlopen(r).status)"
  graphify:
    build:
      context: .
      dockerfile: Dockerfile.graphify
    restart: unless-stopped
    volumes:
      - graphs:/graphs:ro
    logging: *default-logging

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio pubblico. Per HTTPS automatico usa il FQDN; per smoke locali
      # usa ":80" (solo HTTP) o "localhost" (TLS self-signed).
      DOMAIN: ${DOMAIN:-:80}
      SERVER_UPSTREAM: server:${PORT:-3000}
      # Sottodominio del relay push (`push.<host>`), usato SOLO dal blocco di
      # sito opzionale in caddy.d. Vuoto per tutte le istanze self-hosted, che
      # quel blocco non ce l'hanno: vedi caddy.d/README.md.
      PUSH_RELAY_HOST: ${PUSH_RELAY_HOST:-}
    logging: *default-logging
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Blocchi di sito aggiuntivi montati dall'host. Nel repo la cartella
      # contiene solo file `.example`, che il glob `*.caddy` del Caddyfile non
      # matcha: per chi non usa il relay non cambia nulla.
      - ./caddy.d:/etc/caddy/conf.d:ro

  # RELAY PUSH — gira SOLO sul nostro VPS, sotto il profilo `relay`.
  #
  # Il modello è relay-only: l'app sugli store è una sola (la nostra), quindi le
  # chiavi APNs/FCM sono legate alla NOSTRA identità di publisher e vivono solo
  # qui. Le istanze self-hosted NON avviano questo servizio — lo CHIAMANO via
  # HTTPS (`PUSH_RELAY_URL`, che di default punta già al relay pubblico). Il
  # `profiles` è ciò che le tiene fuori: senza `--profile relay` il servizio non
  # viene né buildato né avviato da `docker compose up -d`.
  #
  # ⚠️ È il bersaglio di maggior valore del sistema: chi ruba queste chiavi può
  # mandare notifiche a nome di Stubwise a OGNI telefono su cui l'app è
  # installata. Per questo non pubblica porte sull'host (ci arriva solo Caddy,
  # dalla rete interna) e non monta nulla.
  push-relay:
    build:
      context: .
      dockerfile: Dockerfile.push-relay
    profiles: ["relay"]
    restart: unless-stopped
    environment:
      # Service account Firebase in base64 (`base64 -i sa.json | tr -d '\n'`).
      # Obbligatorio: è il canale attivo per Android e, in v1, anche per iOS.
      # Il relay fallisce l'avvio se manca, invece di consegnare a vuoto.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # `fcm` (default) o `apns`. In v1 l'app usa Firebase Messaging anche su
      # iOS, quindi un token `ios` è un token FCM: instradarlo ad APNs lo
      # farebbe rifiutare. Si passerà a `apns` in fase 4b, coi token nativi.
      IOS_PUSH_VIA: ${IOS_PUSH_VIA:-fcm}
      # Obbligatorie SOLO con IOS_PUSH_VIA=apns (il relay lo verifica all'avvio).
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      # ⚠️ Solo "true" o "false": niente 1/0/yes, che il relay rifiuta. Un
      # ambiente sbagliato fa rispondere ad Apple `BadDeviceToken`, lo stesso
      # codice di un token inventato — indistinguibile a valle.
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
      RELAY_RATE_PER_TOKEN_HOUR: ${RELAY_RATE_PER_TOKEN_HOUR:-60}
      RELAY_RATE_PER_TOKEN_DAY: ${RELAY_RATE_PER_TOKEN_DAY:-500}
      RELAY_RATE_PER_IP_MINUTE: ${RELAY_RATE_PER_IP_MINUTE:-600}
    logging: *default-logging

volumes:
  pgdata:
  mirrors:
  claude-config:
  caddy-data:
  caddy-config:
  # Modelli scaricati da Ollama (es. bge-m3): persistono tra i riavvii.
  ollama:
  # Grafi delle dipendenze prodotti da graphify (un sottoalbero per repository):
  # scritti dal worker, rigenerati a ogni build. Non sono un dato di verità (si
  # possono ricostruire dai mirror), ma persisterli evita di rifare il lavoro.
  graphs:
  # Plugin Claude Code del registro d'istanza, materializzati dal worker a sha
  # (`<slug>/<sha>/`). Ricostruibili dal registro (sorgente e ref stanno nel DB),
  # ma persisterli evita di rifetchare a ogni riavvio. Solo il worker lo monta:
  # il server legge l'inventario dal DB e non ha bisogno dei file.
  claude-plugins:
